name: Build and Deploy Backend

on:
  push:
    branches:
      - master

jobs:
  build_and_deploy_admin:
    runs-on: ubuntu-latest
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      FIREWALL_NAME: ${{ secrets.FIREWALL_NAME }}
      HOST: 37.27.246.249
      REMOTE_USER: root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies & hcloud CLI
        run: |
          sudo apt update && sudo apt install -y bzip2 openssh-client
          curl -sL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz | tar xz
          sudo mv hcloud /usr/local/bin/

      - name: Get GitHub Runner Public IP
        id: get_ip
        run: |
          IP=$(curl -s https://api.ipify.org)
          echo "runner_ip=$IP" >> $GITHUB_OUTPUT

      - name: Add Runner IP to Hetzner Firewall
        run: |
          hcloud firewall add-rule $FIREWALL_NAME \
            --direction in \
            --protocol tcp \
            --port 5432 \
            --source-ips ${{ steps.get_ip.outputs.runner_ip }}/32

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add remote host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.HOST }} >> ~/.ssh/known_hosts

      - name: Ensure target directory exists on remote
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HOST }}
          username: ${{ env.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            mkdir -p /opt/lysyy

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.HOST }}
          username: ${{ env.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.yml"
          target: "/opt/lysyy"

      - name: Run PostgreSQL on remote server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HOST }}
          username: ${{ env.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/lysyy
            docker compose up -d postgres

      - name: Build Docker image
        run: |
          echo "NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}" > .env
          echo "DATABASE_URI=${{ secrets.DATABASE_URI }}" >> .env
          echo "PREVIEW_SECRET=${{ secrets.PREVIEW_SECRET }}" >> .env
          echo "PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}" >> .env
          echo "PAYLOAD_PUBLIC_DRAFT_SECRET=${{ secrets.PAYLOAD_PUBLIC_DRAFT_SECRET }}" >> .env
          echo "REVALIDATION_KEY=${{ secrets.REVALIDATION_KEY }}" >> .env
          echo "PAYLOAD_AUTOSAVE_INTERVAL=${{ secrets.PAYLOAD_AUTOSAVE_INTERVAL }}" >> .env
          echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env
          echo "NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}" >> .env
          echo "RECAPTCHA_SECRET_KEY=${{ secrets.RECAPTCHA_SECRET_KEY }}" >> .env

          docker build -t lysyy:latest .
          rm -f .env

      - name: Save Docker image to tarball
        run: docker save lysyy:latest | gzip > lysyy.tar.gz

      - name: Copy image and compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.HOST }}
          username: ${{ env.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "lysyy.tar.gz"
          target: "/opt/lysyy"

      - name: Deploy on remote server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HOST }}
          username: ${{ env.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/lysyy
            docker load < lysyy.tar.gz
            rm lysyy.tar.gz
            docker compose up -d payload
            docker image prune -f

      - name: Remove Runner IP from Hetzner Firewall
        if: always()
        run: |
          hcloud firewall delete-rule $FIREWALL_NAME \
            --direction in \
            --protocol tcp \
            --port 5432 \
            --source-ips ${{ steps.get_ip.outputs.runner_ip }}/32
